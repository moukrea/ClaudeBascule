name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! $TITLE =~ $re ]]; then
            echo "::error::The PR title must follow Conventional Commits, e.g. 'feat: add …' or 'fix(app): …'. It becomes the commit on main and decides the next version."
            exit 1
          fi

  ui:
    name: UI scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and translations
        run: |
          node --check app/ui/app.js
          node --check app/ui/i18n.js
          node -e '
            const vm = require("vm"); const c = {}; vm.createContext(c);
            vm.runInContext(require("fs").readFileSync("app/ui/i18n.js", "utf8") + ";this.I = I18N;", c);
            const en = Object.keys(c.I.en); let bad = 0;
            for (const [l, t] of Object.entries(c.I)) { const miss = en.filter((k) => !(k in t)); if (miss.length) { bad = 1; console.log(l, "misses", miss.join(", ")); } }
            process.exit(bad);'

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
