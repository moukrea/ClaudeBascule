name: Release

# Every merge on main is released: the version comes from the Conventional Commits merged since
# the last tag (tools/next-version.sh).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(tools/next-version.sh notes.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: ${version:-none}"
      - if: steps.v.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            kind: linux
          - os: macos-latest
            kind: macos
          - os: windows-latest
            kind: windows
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${{ matrix.kind }}" = macos ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin; fi
      - name: Set the version
        shell: bash
        run: |
          # Windows checkouts have CRLF line endings.
          perl -0pi -e 's/(\[workspace\.package\]\r?\nversion = ")[^"]*"/${1}$ENV{VERSION}"/' Cargo.toml
          grep -q "^version = \"$VERSION\"" Cargo.toml || { echo "::error::could not set the version in Cargo.toml"; exit 1; }
      - name: Build (Linux)
        if: matrix.kind == 'linux'
        run: |
          cargo build --release -p bascule -p bascule-app
          test "$(target/release/bascule --version)" = "bascule $VERSION"
          dist/package.sh linux target/release out
      - name: Build (macOS, universal)
        if: matrix.kind == 'macos'
        run: |
          cargo build --release -p bascule -p bascule-app --target aarch64-apple-darwin
          cargo build --release -p bascule -p bascule-app --target x86_64-apple-darwin
          mkdir -p universal
          for b in bascule bascule-app; do
            lipo -create -output universal/$b target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
          done
          test "$(universal/bascule --version)" = "bascule $VERSION"
          dist/package.sh macos universal out "$VERSION"
      - name: Build (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          cargo build --release -p bascule -p bascule-app
          $v = & target/release/bascule.exe --version
          if ($v -ne "bascule $env:VERSION") { throw "built version is '$v', expected $env:VERSION" }
          New-Item -ItemType Directory -Force out | Out-Null
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target/release/bascule.exe, target/release/bascule-app.exe stage/
          Copy-Item -Recurse extension/chrome stage/chrome-extension
          Compress-Archive -Path stage/* -DestinationPath out/claude-bascule-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.kind }}
          path: out/*

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish the release
        run: |
          mkdir release
          cp dl/build-*/* release/
          cp dist/install.sh dist/install.ps1 release/
          (cd release && sha256sum * > SHA256SUMS)
          gh release create "v$VERSION" release/* \
            --target "$GITHUB_SHA" \
            --title "Claude Bascule $VERSION" \
            --notes-file dl/notes/notes.md
