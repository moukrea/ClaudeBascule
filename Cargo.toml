[workspace]
resolver = "2"
members = ["crates/bascule-core", "crates/bascule", "app"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2.12", features = ["json", "proxy-from-env"] }

[profile.release]
strip = true
lto = "thin"
